<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IKARUGA · Sitio en actualización</title>
  <meta name="description" content="La información de IKARUGA se encuentra en actualización.">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff8f1; color: #191615; font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 620px); text-align: center; }
    img { width: min(210px, 65vw); height: auto; margin-bottom: 40px; }
    .notice { background: #fff; border: 1px solid #ebdfd2; border-radius: 24px; padding: clamp(32px, 7vw, 56px); box-shadow: 0 18px 45px rgba(55, 31, 17, .09); }
    .label { margin: 0 0 16px; color: #9c1d22; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(32px, 7vw, 52px); line-height: 1.08; }
    p:last-child { margin: 20px 0 0; color: #5f5650; font-size: 18px; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="IKARUGA">
    <section class="notice" aria-labelledby="title">
      <p class="label">Información temporal</p>
      <h1 id="title">Link no disponible</h1>
      <p>Estamos actualizando la información. Volvé a intentarlo pronto.</p>
    </section>
  </main>
</body>
</html>
